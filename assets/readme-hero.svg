<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">vibe-dlmath — intuition into inspectable arguments</title>
  <desc id="desc">A deep-learning mathematics library and agent skill. The workflow moves from explicit assumptions through derivation to critical audit, with sources and limitations supporting every step. Audit does not imply automatic proof certification.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1423"/>
      <stop offset="1" stop-color="#14283b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.83" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#52c9b0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#52c9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#203b4c"/>
      <stop offset="1" stop-color="#172a3b"/>
    </linearGradient>
    <linearGradient id="auditCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c354d"/>
      <stop offset="1" stop-color="#1c2b3e"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#b4d2e1" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020a15" flood-opacity="0.22"/>
    </filter>
    <clipPath id="canvas"><rect width="1440" height="480" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1440" height="480" fill="url(#background)"/>
    <rect width="1440" height="480" fill="url(#glow)"/>
    <rect x="744" width="696" height="480" fill="url(#dots)"/>
    <path d="M 752 52 V 428" stroke="#b4d2e1" stroke-opacity="0.1"/>

    <!-- The library identity stays readable when the banner is scaled down. -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="64" y="60" width="34" height="4" rx="2" fill="#89e9c4"/>
      <text x="112" y="68" fill="#a2c5ce" font-size="17" font-weight="700" letter-spacing="2.2">DEEP LEARNING × MATHEMATICS</text>
      <text x="60" y="184" fill="#f2f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="80" font-weight="700" letter-spacing="-4.5">vibe-dlmath</text>
      <text x="64" y="250" fill="#d5e5ed" font-size="30">Intuition into arguments.</text>
      <text x="64" y="291" fill="#d5e5ed" font-size="30">Every assumption in the open.</text>
      <path d="M 64 350 H 684" stroke="#b4d2e1" stroke-opacity="0.16"/>
      <text x="64" y="394" fill="#89e9c4" font-size="21" font-weight="700">PROOF LIBRARY</text>
      <circle cx="249" cy="387" r="2.5" fill="#617f91"/>
      <text x="271" y="394" fill="#aac1cf" font-size="21">REUSABLE AGENT SKILL</text>
    </g>

    <!-- Solid arrows show the reasoning workflow, not an automated verdict. -->
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="806" y="86" fill="#d5e5ed" font-size="24" font-weight="700">Make every step inspectable.</text>
      <g filter="url(#shadow)">
        <rect x="806" y="122" width="156" height="180" rx="22" fill="url(#card)" stroke="#6fbfae" stroke-opacity="0.55"/>
        <rect x="998" y="122" width="156" height="180" rx="22" fill="url(#card)" stroke="#6fbfae" stroke-opacity="0.55"/>
        <rect x="1190" y="122" width="156" height="180" rx="22" fill="url(#auditCard)" stroke="#b7a6e7" stroke-opacity="0.6"/>
      </g>

      <g fill="#91adbd" font-size="16" font-weight="700" letter-spacing="1">
        <text x="826" y="151">01</text>
        <text x="1018" y="151">02</text>
        <text x="1210" y="151">03</text>
      </g>
      <g fill="none" stroke="#8de7c8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- A scoped interval: state where the argument is allowed to work. -->
        <path d="M 868 180 H 859 V 221 H 868 M 900 180 H 909 V 221 H 900"/>
        <path d="M 872 201 H 896" stroke-opacity="0.6"/>
        <circle cx="884" cy="201" r="5" fill="#8de7c8" stroke="none"/>
        <!-- A derivation: separate premises lead to a single next step. -->
        <path d="M 1052 190 H 1089 M 1052 210 H 1089 M 1080 181 L 1100 200 L 1080 219"/>
      </g>
      <g fill="none" stroke="#c6b5f2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- A lens, rather than a check mark: inspect claims and remaining gaps. -->
        <circle cx="1263" cy="196" r="17"/>
        <path d="M 1276 209 L 1290 223 M 1257 196 H 1269 M 1263 190 V 202"/>
      </g>
      <g fill="#f0f6fa" font-size="25" font-weight="700" text-anchor="middle">
        <text x="884" y="271">Assume</text>
        <text x="1076" y="271">Derive</text>
        <text x="1268" y="271">Audit</text>
      </g>
      <g fill="none" stroke="#92b8c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 969 211 H 990 M 984 205 L 990 211 L 984 217"/>
        <path d="M 1161 211 H 1182 M 1176 205 L 1182 211 L 1176 217"/>
      </g>

      <!-- Evidence is a shared foundation, not a detached final box. -->
      <path d="M 884 302 V 327 H 1268 V 302 M 1076 302 V 350" fill="none" stroke="#78a29e" stroke-width="1.5" stroke-dasharray="4 6"/>
      <rect x="806" y="351" width="540" height="65" rx="16" fill="#152b3a" stroke="#46666f" stroke-opacity="0.7"/>
      <g fill="none" stroke="#8de7c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 832 370 H 848 L 855 377 V 397 H 832 Z M 848 370 V 377 H 855 M 838 383 H 849 M 838 389 H 846"/>
      </g>
      <text x="873" y="391" fill="#bad1d9" font-size="20">Sources · assumptions · limitations</text>
    </g>
  </g>
</svg>
